# Example config for gha-docker-controller.
# Never put secret values in this file.

github:
  url: https://github.com
  scope: organization
  owner: your-organization
  repository: ""
  app:
    id: 123456
    installationId: 654321
    privateKeyFile: /etc/gha-docker-controller/github-app.pem

scaleSet:
  name: production
  runnerGroup: default
  minRunners: 0
  maxRunners: 4

docker:
  host: unix:///var/run/docker.sock
  pullPolicy: if-not-present

runner:
  image: ghcr.io/actions/actions-runner@sha256:0cfdcc701ce933c6d243c6b0b2da767366dc9f2e99961d4c3754b0b78084cdda
  # HostConfig keys use Docker's API names without case sensitivity.
  hostConfig:
    pidsLimit: 512
  provisioningTimeout: 5m
  stopTimeout: 30s

health:
  listen: 127.0.0.1:8080

shutdown:
  busyRunnerPolicy: leave
  gracePeriod: 2m

log:
  format: json
  level: info
